<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e504b">
    <meta name="description" content="Interner Dokumenteditor für Anamneseberichte.">
    <title>Anamnese Editor</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg?v=20260517-icon" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="./styles.css?v=20260524-document-editor">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <strong>Anamnese Editor</strong>
          <span id="baseDir">GitHub-Speicher wird geladen</span>
        </div>
        <div class="toolbar">
          <button id="installButton" type="button" hidden>Installieren</button>
          <button id="newCaseButton" type="button">Neuer Fall</button>
          <button id="codexBriefingButton" type="button">Codex-Briefing</button>
          <button id="aiDraftButton" type="button">KI-Entwurf</button>
          <button id="reloadButton" type="button">Aktualisieren</button>
          <button id="deleteCaseButton" type="button" class="danger">Fall löschen</button>
          <button id="saveButton" type="button" class="primary">Speichern</button>
        </div>
      </header>

      <aside class="sidebar" aria-label="Fall- und Dateiauswahl">
        <section class="panel">
          <label for="folderSearch">Fallordner suchen</label>
          <input id="folderSearch" type="search" placeholder="Name, Tier, Datum">
          <div id="folderList" class="listbox" role="listbox" aria-label="Fallordner mit Dokumenten"></div>
        </section>

        <section class="panel files-panel">
          <div class="panel-title">Dokumente</div>
          <div id="fileList" class="listbox compact" role="listbox" aria-label="Dokumente"></div>
        </section>
      </aside>

      <main class="workspace">
        <section class="document-head">
          <div>
            <div class="caption">Aktives Dokument</div>
            <h1 id="activeFile">Kein Dokument geöffnet</h1>
            <div id="activePath" class="pathline"></div>
          </div>
          <div id="saveStatus" class="status idle">Bereit</div>
        </section>

        <section class="controls">
          <div class="tabs" role="tablist" aria-label="Bearbeitungsmodus">
            <button class="tab active" data-mode="preview" type="button">Dokument</button>
            <button class="tab" data-mode="sections" type="button">Abschnitte</button>
            <button class="tab" data-mode="edit" type="button">Markdown</button>
          </div>
          <div class="findbar">
            <input id="findInput" type="search" placeholder="Suchen">
            <button id="findNextButton" type="button">Nächstes</button>
            <input id="replaceInput" type="text" placeholder="Ersetzen durch">
            <button id="replaceAllButton" type="button">Alles ersetzen</button>
          </div>
        </section>

        <section id="editView" class="view">
          <textarea id="markdownEditor" spellcheck="true" placeholder="Wähle links einen Fallordner und ein Dokument."></textarea>
        </section>

        <section id="sectionsView" class="view split-view">
          <nav id="sectionNav" class="section-nav" aria-label="Abschnitte"></nav>
          <div id="sectionEditor" class="section-editor"></div>
        </section>

        <section id="previewView" class="view active document-canvas">
          <article id="preview" class="preview document-page"></article>
        </section>
      </main>
    </div>

    <dialog id="newCaseDialog" class="wide-dialog">
      <form id="newCaseForm">
        <h2>Neuen Fall anlegen</h2>
        <div class="case-form">
          <label>
            Datum
            <input id="newCaseDate" name="caseDate" type="date" required>
          </label>
          <label>
            Besitzer
            <input id="newCaseOwner" name="owner" type="text" autocomplete="off">
          </label>
          <label>
            Tiername
            <input id="newCaseAnimal" name="animalName" type="text" autocomplete="off">
          </label>
          <label>
            Tierart
            <input id="newCaseSpecies" name="species" type="text" autocomplete="off">
          </label>
          <label class="full-span">
            Schwerpunkt
            <input id="newCaseTopic" name="topic" type="text" autocomplete="off" placeholder="z. B. Asthma, EOTRH, Arthrose">
          </label>
          <label class="full-span">
            Titel
            <input id="newCaseTitle" name="title" type="text" autocomplete="off">
          </label>
          <label class="full-span">
            Rohdaten
            <textarea id="newCaseRaw" name="rawData" required placeholder="Rohdaten hier einfuegen"></textarea>
          </label>
        </div>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="cancelNewCaseButton">Abbrechen</button>
          <button type="submit" class="primary">Fall anlegen</button>
        </div>
      </form>
    </dialog>

    <dialog id="conflictDialog">
      <form method="dialog">
        <h2>Dokument wurde verändert</h2>
        <p>Das Dokument wurde seit dem Laden in GitHub geändert. Du kannst neu laden oder nach Prüfung erneut speichern.</p>
        <div class="dialog-actions">
          <button value="reload" type="submit">Neu laden</button>
          <button value="cancel" type="submit">Abbrechen</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=20260524-document-editor" type="module"></script>
  </body>
</html>
